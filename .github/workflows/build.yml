name: Build Mod
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to publish as a release (e.g. v3.0.0); leave empty for a test build'
        required: false
        default: ''
  push:
    branches: [main, ccr-b5c0153f-magtn3]
    tags: ['v*']
    paths-ignore: ['docs/**', 'scripts/**', '.github/workflows/pages.yml', 'README.md']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
        - name: macOS
          os: macos-latest
        - name: iOS
          os: macos-latest
          target: iOS
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      # Geode's bindings and code generator now follow Geode 6 (GD 2.2091). Kosmos is a Geode
      # 5.11 mod for GD 2.2081, so it builds with the SDK from mod.json, the bindings as they
      # were for 5.11 (the day after v3.6.0 built) and a code generator built from them.
      - name: Bindings for Geode 5.11
        shell: bash
        run: |
          dir="$RUNNER_TEMP/geode-bindings"
          git clone -q --filter=blob:none https://github.com/geode-sdk/bindings "$dir"
          rev=$(git -C "$dir" rev-list -n 1 --before="2026-11-02T00:00:00Z" HEAD)
          git -C "$dir" checkout -q "$rev"
          echo "bindings at $rev"
          echo "GEODE_BINDINGS_REPO_PATH=$dir" >> "$GITHUB_ENV"
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
      # a release (run by hand with a version, or a v* tag) publishes Kosmos.geode with
      # RELEASE_NOTES.md; any other build replaces TESTEBUFFER.geode on the "teste" pre-release
      - name: Publish the .geode
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.build.outputs.build-output }}
          RELEASE: ${{ inputs.release }}
        run: |
          file=$(find "$OUT" -name '*.geode' | head -n 1)
          test -n "$file"
          tag="$RELEASE"
          if [[ -z "$tag" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            cp "$file" Kosmos.geode
            gh release create "$tag" Kosmos.geode --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Kosmos $tag" --notes-file RELEASE_NOTES.md --latest
          else
            cp "$file" TESTEBUFFER.geode
            gh release delete teste --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create teste TESTEBUFFER.geode --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "TESTEBUFFER" --notes "Test build of commit $GITHUB_SHA"
          fi
